# Fichier pour tester les perfs du site :  70 users simultanés -> OK
# voir fichier "rapport"
config:
  target: "https://pur-medialibrary.azurewebsites.net"
  phases:
    - duration: 120
      arrivalRate: 2
      name: "Plateau Constant : 70 utilisateurs simultanés"

scenarios:
  - name: "Navigation B2B Longue"
    weight: 1
    flow:
      # 1. Arrivée sur la liste des portails (et lecture pendant 5s)
      - get:
          url: "/portals"
          headers:
            Cookie: "portal_session=s%3ApjOohs_aToeK_hUS76sV2M3J-MjpnvVZ.34MuAOQjadZ%2BWXNpcOZFuRgThGNNsewGuZwi5pyM3Mc"
      - think: 5
      
      # 2. Ouverture d'un portail client (et consultation pendant 10s)
      - get:
          url: "/portal/test-26"
          headers:
            Cookie: "portal_session=s%3ApjOohs_aToeK_hUS76sV2M3J-MjpnvVZ.34MuAOQjadZ%2BWXNpcOZFuRgThGNNsewGuZwi5pyM3Mc"
      - think: 10
      
      # 3. Lancement d'une recherche (et analyse des résultats pendant 10s)
      - get:
          url: "/search_file?filename=logo&page=1&per_page=100"
          headers:
            Cookie: "portal_session=s%3ApjOohs_aToeK_hUS76sV2M3J-MjpnvVZ.34MuAOQjadZ%2BWXNpcOZFuRgThGNNsewGuZwi5pyM3Mc"
      - think: 10
      
      # 4. Vérification de l'arborescence (fin de session 10s)
      - get:
          url: "/get_folders"
          headers:
            Cookie: "portal_session=s%3ApjOohs_aToeK_hUS76sV2M3J-MjpnvVZ.34MuAOQjadZ%2BWXNpcOZFuRgThGNNsewGuZwi5pyM3Mc"
      - think: 10
