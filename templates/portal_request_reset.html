<!-- Page pour qu'un client puisse demander un lien de réinitialisation -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal_reset_password_style.css') }}">

    <style>
        #background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        .pur-corner-logo {
            position: fixed;
            top: 22px;
            left: 24px;
            z-index: 40;
            line-height: 0;
            text-decoration: none;
        }
        .pur-logo-plate {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #ffffff !important;
            padding: 6px 12px;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        }
        .pur-logo-plate img {
            height: 40px;
            width: auto;
            display: block;
        }
        .logo {
            width: 68px;
            height: 68px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #7c5cfc 0%, #4f46e5 52%, #2563eb 100%);
            box-shadow: 0 10px 28px rgba(79, 70, 229, 0.38);
        }
        .logo i,
        .logo .fa,
        .logo .fas {
            display: none !important;
        }
        .logo svg {
            width: 30px;
            height: 30px;
            display: block;
        }
    </style>
</head>
<body>

    <video id="background-video" autoplay muted loop playsinline>
        <source src="{{ url_for('static', filename='login-bgg.mp4') }}" type="video/mp4">
    </video>

    <div class="particles-container" id="particles-container"></div>
    <a class="pur-corner-logo" href="https://pur.co/" target="_blank" rel="noopener noreferrer">
        <span class="pur-logo-plate">
            <img src="{{ url_for('static', filename='PUR_Logo_2026.jpg') }}" alt="PUR" onerror="this.onerror=null;this.src='https://comptestockageapi.blob.core.windows.net/media-library/PUR_Logo_2026.jpg'">
        </span>
    </a>
    
    <div class="reset-container">
        <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <path d="M3 7l9 7 9-7"></path>
            </svg>
        </div>
        
        <div class="portal-name">{{ portal_name or 'Media Library Portal' }}</div>
        <h2>Forgot Password</h2>
        <p style="text-align: center; color: #a8adb9; margin: 0 0 20px; font-size: 14px; line-height: 1.45;">
            Enter your email and we will send you a link to set a new password.
        </p>
        
        {% set messages = get_flashed_messages(true) %}
        {% if messages and messages.length > 0 %}
            {% for msg in messages %}
                <div class="{{ 'success-message' if msg[0] == 'success' else 'error-message' }}">
                    {{ msg[1] }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="POST" action="/portal/{{ portal_id }}/request_reset">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="Email" required>
            </div>
            
            <button type="submit">Send reset link</button>
        </form>
        
        <div class="back-link">
            <a href="/portal/{{ portal_id }}/login">Back to Login</a>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/portal_login_logic.js') }}"></script>
</body>
</html>
