<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal_reset_style.css') }}">
</head>
<body>
    <div class="particles-container" id="particles-container"></div>
    
    <div class="reset-container">
        <div class="logo">
            <i class="fas fa-key"></i>
        </div>
        
        <div class="portal-name">Media Library Portal</div>
        <h2>Password Reset</h2>
        
        <p class="info-text">Enter your email address to receive a password reset link</p>
        
        {% set messages = get_flashed_messages(true) %}
        {% if messages and messages.length > 0 %}
            {% for msg in messages %}
                <div class="{{ 'success-message' if msg[0] == 'success' else 'error-message' }}">
                    {{ msg[1] }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="POST" action="/portal/{{ portal_id }}/request_reset">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="Email address" required>
            </div>
            
            <button type="submit">Send Reset Link</button>
        </form>
        
        <div class="back-link">
            <a href="/portal/{{ portal_id }}/login">Back to Login</a>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/portal_login_logic.js') }}"></script>
</body>
</html>
