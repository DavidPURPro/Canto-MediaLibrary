<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - PUR Media Library </title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/x-icon">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login_style.css') }}">
</head>
<body>
    <video class="video-bg" autoplay loop muted playsinline>
        <source src="{{ url_for('static', filename='login-bg.mp4') }}" type="video/mp4">
    </video>
    <div class="floating-particles" id="particles"></div>

    <div class="pur-logo-container">
        <a href="https://pur.co/" target="_blank" rel="noopener noreferrer">
            <img src="{{ url_for('static', filename='01_New_PUR_LOGO_Color.png') }}" alt="PUR Logo" class="pur-logo">
        </a>    
    </a>
    </div>

    <div class="login-container">
        <div class="card login-card">
            <div class="card-header login-header">
                <h4 class="login-title" style="font-family: Arial, Helvetica, sans-serif; font-weight: bold; color: #16677c;">PUR Media Library</h4>
            </div>
            <div class="card-body">
                {% set messages = get_flashed_messages(true) %}
                {% if messages and messages.length > 0 %}
                    {% for msg in messages %}
                        <div class="alert alert-{{ msg[0] }}">{{ msg[1] }}</div>
                    {% endfor %}
                {% endif %}
                
                <a href="/start_auth" class="btn btn-primary w-100 login-btn" id="loginButton">
                Log in <i class="fas fa-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>

    <div class="login-legal-footer">
        <a href="https://www.pur.co/privacy-policy" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/login_logic.js') }}"></script>

</body>
</html>
