<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File deletion</title>
    <link rel="icon" href="{{ url_for('static', filename='pur_logo_delete.png') }}" type="image/x-icon">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/delete_style.css') }}">
</head>
<body>
    <div class="container delete-container">
        
        <div class="text-center mb-5 mt-5">
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm mb-3 rounded-pill px-3">
                <i class="fas fa-arrow-left me-2"></i> Go back Media Library
            </a>
            <h2><i class="fas fa-trash-alt text-danger me-2"></i> File deletion</h2>
        </div>

        <div class="search-box mx-auto" style="max-width: 600px;">
            <input type="text" id="search-input" class="search-input shadow-sm" placeholder="Search by file name or tag...">
            <button id="search-button" class="search-btn shadow-sm">
                <i class="fas fa-search"></i>
            </button>
            <div class="search-hint text-center mt-3">You can search by file name or by tag (ex: "tag:planting")</div>
        </div>
        
        <div id="results-container" class="mt-5 mx-auto" style="max-width: 800px;"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/delete_logic.js') }}"></script>
</body>
</html>
