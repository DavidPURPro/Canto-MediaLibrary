<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal_reset_password_style.css') }}">
</head>
<body>
    <div class="particles-container" id="particles-container"></div>
    
    <div class="reset-container">
        <div class="logo">
            <i class="fas fa-lock"></i>
        </div>
        
        <div class="portal-name">Media Library Portal</div>
        <h2>Reset Password</h2>
        
        <div class="email-display">
            For email: <strong>{{ email }}</strong>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="{{ 'success-message' if category == 'success' else 'error-message' }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST">
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="New Password" required minlength="8">
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="confirm_password" placeholder="Confirm Password" required minlength="8">
            </div>
            
            <button type="submit">Set New Password</button>
        </form>
        
        <div class="back-link">
            <a href="{{ url_for('portal_login', portal_id=portal_id) }}">Back to Login</a>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/portal_login_logic.js') }}"></script>
</body>
</html>
