<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload images - Media Library</title>
  <link rel="icon" href="{{ url_for('static', filename='pur_logo_upload.png') }}" type="image/x-icon">
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/upload_style.css') }}">
</head>
<body>

  <header class="ultra-header">
    <div class="header-container">
      <img src="{{ url_for('static', filename='01_New_PUR_LOGO_Color.png') }}" alt="Logo PUR" class="main-logo">
      <h1 class="header-title">Media Library Upload</h1>
      <nav class="nav-controls">
        <a href="{{ url_for('index') }}" class="btn-nav-glass"><i class="fas fa-arrow-left"></i> Back to Gallery</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="upload-wrapper">
      <div class="upload-header">
        <h2><i class="fas fa-cloud-upload-alt"></i> Upload Files</h2>
        <p class="subtitle">Upload images, videos, PDFs or ZIP archives to your library.</p>
      </div>

      <div class="upload-dropzone" id="drop-area">
        <div class="dropzone-icon">
          <i class="fas fa-file-upload"></i>
        </div>
        <p class="dropzone-text">Drag and drop your files here</p>
        <p class="dropzone-subtext">or</p>
        <label for="fileElem" class="btn-browse">Browse your files</label>
        <input type="file" id="fileElem" multiple accept="image/*,.zip">
      </div>

      <div class="upload-status-section">
        <ul id="fileList" class="file-list"></ul>
        
        <div id="loadingSpinner" class="loading-spinner"></div>
        <div id="msg" class="message"></div>
        <div id="warning" class="message warning-msg"></div>
        
        <button id="sendBtn" class="btn-send" disabled>
          <i class="fas fa-paper-plane"></i> Send Files
        </button>
      </div>
    </div>
  </main>

  <div id="fileDetailsModal" class="modern-modal-overlay">
    <div class="modal-window">
      <div class="modal-header">
        <h3>File Details</h3>
        <button class="close-btn">&times;</button>
      </div>
      
      <div class="modal-body">
        <div class="form-layout">
          <div class="preview-column">
            <label>Preview</label>
            <div class="preview-container">
              <img id="filePreview" class="preview-image" src="" alt="Preview">
            </div>
          </div>
          
          <div class="form-column">
            <div class="form-group">
              <label for="fileDescription">Description</label>
              <textarea id="fileDescription" placeholder="Enter a description for this file"></textarea>
            </div>
            
            <div class="form-row">
              <div class="form-group half">
                <label for="fileEventDate">Event Date</label>
                <input type="date" id="fileEventDate" class="modern-input">
              </div>
              <div class="form-group half">
                <label for="filePortal">Add to Portal</label>
                <select id="filePortal" class="modern-input">
                  <option value="none">(No portal)</option>
                </select>
              </div>
            </div>

            <div class="form-group tags-section">
              <label>Select Tags</label>
              <div class="tag-selects-grid">
                <div class="select-wrapper">
                  <span class="tag-category">Region</span>
                  <select class="modern-select" id="regionTags" onchange="addTagFromSelect(this)">
                    <option value="">Select...</option>
                    <option value="France">France</option>
                    <option value="Canada">Canada</option>
                    <option value="Colombia">Colombia</option>
                    <option value="Indonesia">Indonesia</option>
                    </select>
                </div>
                
                <div class="select-wrapper">
                  <span class="tag-category">Project Type</span>
                  <select class="modern-select" id="projectTypeTags" onchange="addTagFromSelect(this)">
                    <option value="">Select...</option>
                    <option value="Agroforestry project">Agroforestry project</option>
                    <option value="Reforestation project">Reforestation project</option>
                  </select>
                </div>

                <div class="select-wrapper">
                  <span class="tag-category">Activity</span>
                  <select class="modern-select" id="activityTags" onchange="addTagFromSelect(this)">
                    <option value="">Select...</option>
                    <option value="Tree Planting">Tree Planting</option>
                    <option value="Harvesting">Harvesting</option>
                  </select>
                </div>

                <div class="select-wrapper">
                  <span class="tag-category">Commodity</span>
                  <select class="modern-select" id="commodityTags" onchange="addTagFromSelect(this)">
                    <option value="">Select...</option>
                    <option value="Coffee">Coffee</option>
                    <option value="Cocoa">Cocoa</option>
                  </select>
                </div>
              </div>

              <div class="custom-tag-section mt-3">
                <div class="tag-input-container">
                  <input type="text" id="fileTags" class="modern-input" placeholder="Add custom tags and press enter...">
                  <button id="addTagBtn" class="btn-add-tag"><i class="fas fa-plus"></i></button>
                </div>
                <div id="tagsContainer" class="tags-container"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="modal-footer">
        <button id="cancelBtn" class="btn-secondary">Cancel</button>
        <button id="saveBtn" class="btn-primary">Save Details</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/upload_logic.js') }}"></script>
</body>
</html>
