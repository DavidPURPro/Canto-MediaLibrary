<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal_login_style.css') }}">
</head>
<body>
    <div class="particles-container" id="particles-container"></div>
    
    <div class="login-container">
        <div class="portal-name">{{ portal_name }}</div>
        <h2>Login</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="{{ 'success-message' if category == 'success' else 'error-message' }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('portal_login', portal_id=portal_id) }}">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="Email" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            
            <button type="submit">Log In</button>
        </form>
        
        <div class="forgot-password">
            <a href="{{ url_for('portal_request_reset', portal_id=portal_id) }}">Forgot your password?</a>
        </div>

        <div class="back-to-portals">
            <a href="{{ url_for('portals') }}">
                <i class="fas fa-arrow-left"></i> Back to Portals
            </a>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/portal_login_logic.js') }}"></script>
</body>
</html>
